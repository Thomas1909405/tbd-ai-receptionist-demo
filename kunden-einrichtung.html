const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang='de',step=0;const state={};const T=i=>I18N[lang][i];
const fields=[
{step:0,id:'campground',i:6,required:true},{step:0,id:'website',i:7,type:'url'},{step:0,id:'contact',i:8,required:true},{step:0,id:'email',i:9,type:'email',required:true},{step:0,id:'phone',i:10,type:'tel'},
{step:1,id:'hours',i:16},{step:1,id:'checkin',i:17},{step:1,id:'checkout',i:18},{step:1,id:'dogInfo',i:23},{step:1,id:'otherFacilities',i:32},{step:1,id:'rules',i:33,type:'url'},

function field(f){return `<label class="field">${esc(T(f.i))}${f.required?' *':''}${f.textarea?`<textarea name="${f.id}" data-field="${f.id}">${esc(state[f.id]||'')}</textarea>`:`<input name="${f.id}" data-field="${f.id}" type="${f.type||'text'}" value="${esc(state[f.id]||'')}" ${f.required?'required':''}>`}</label>`}
function group(id,title,options,multi=false){let selected=state[id]|| (multi?[]:'');return `<fieldset><legend>${esc(title)}</legend><div class="choices">${options.map(([v,t])=>`<label><input data-group="${id}" type="${multi?'checkbox':'radio'}" name="${id}" value="${esc(v)}" ${multi?selected.includes(v)?'checked':'':selected===v?'checked':''}>${esc(t)}</label>`).join('')}</div></fieldset>`}
function getData(){document.querySelectorAll('[data-field]').forEach(e=>state[e.dataset.field]=e.value);document.querySelectorAll('[data-group]').forEach(e=>{if(e.type==='checkbox'){if(!Array.isArray(state[e.dataset.group]))state[e.dataset.group]=[];state[e.dataset.group]=[...document.querySelectorAll(`[data-group="${e.dataset.group}"]:checked`)].map(x=>x.value)}else if(e.checked)state[e.dataset.group]=e.value})}

return `<div class="summary">${Object.entries(state).filter(([k,v])=>v!==''&&v!=null&&(!Array.isArray(v)||v.length)).map(([k,v])=>`<div><b>${esc(k)}</b>${esc(Array.isArray(v)?v.join(', '):v)}</div>`).join('')||esc(T(71))}</div>`+group('followup',T(66),[['consult',T(64)],['info',T(65)]],true)+`<p class="hint">${esc(T(73))}</p>`}
function render(){document.documentElement.lang=lang;$('#heading').textContent={de:'Kunden-Einrichtungsformular',da:'Kundeoprettelsesformular',en:'Customer setup form',no:'Kundeoppsett',sv:'Kundinställningsformulär'}[lang];$('#sub').textContent={de:'Gastfreundschaft kennt keine Öffnungszeiten. Teilen Sie uns Ihre bestätigten Informationen mit.',da:'Gæstfrihed har ingen åbningstider. Del jeres bekræftede oplysninger med os.',en:'Hospitality has no opening hours. Share your confirmed business information.',no:'Gjestfrihet har ingen åpningstider. Del bekreftet informasjon med oss.',sv:'Gästfrihet har inga öppettider. Dela era bekräftade uppgifter med oss.'}[lang];$('#warning').textContent=T(68);$('#progress').innerHTML=[0,1,2,3].map(n=>`<span class="${n<=step?'active':''}"></span>`).join('');$('#stepinfo').textContent=T(70).replace('{n}',step+1);$('#steptitle').textContent=T(step);$('#content').innerHTML=page();$('#back').textContent=T(5);$('#back').classList.toggle('hide',step===0);$('#next').textContent=step===3?T(67):T(4);$('#next').disabled=step===3;}
$('#lang').addEventListener('change',e=>{getData();lang=e.target.value;render()});$('#back').addEventListener('click',()=>{getData();step=Math.max(0,step-1);render();window.scrollTo(0,0)});$('#next').addEventListener('click',()=>{getData();if(step===0){let missing=fields.filter(f=>f.step===0&&f.required).some(f=>!String(state[f.id]||'').trim());let e=String(state.email||'');if(missing||!/^\S+@\S+\.\S+$/.test(e)){alert(T(69));return}}step=Math.min(3,step+1);render();window.scrollTo(0,0)});render();
