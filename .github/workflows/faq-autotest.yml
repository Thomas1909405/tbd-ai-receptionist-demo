name: TBD FAQ AutoTest

on:
  push:
    branches:
      - v1-faq-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  faq-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start local demo server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 &
          echo $! > /tmp/tbd-faq-server.pid

      - name: Run automated FAQ tests
        run: npm test
