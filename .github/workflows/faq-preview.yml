name: Prepare FAQ Preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy FAQ development version
        run: |
          git fetch origin v1-faq-development
          mkdir -p faq-test
          git archive origin/v1-faq-development | tar -x -C faq-test
          rm -rf faq-test/.github
          rm -rf faq-test/faq-test
          rm -rf faq-test/v07-test
          rm -rf faq-test/v1-preview
          touch faq-test/.nojekyll

      - name: Publish FAQ preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add faq-test

          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update FAQ test preview"
            git push origin HEAD:main
          fi
