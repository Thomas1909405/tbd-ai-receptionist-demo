name: Prepare V1.0 Preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy V1.0 website
        run: |
          git fetch origin receptionist-v1.0
          mkdir -p v1-preview
          git show origin/receptionist-v1.0:index-v1.html > v1-preview/index.html

      - name: Publish preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add v1-preview/index.html

          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update V1.0 preview"
            git push origin HEAD:main
          fi
