name: Prepare V0.7 Preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Copy V0.7 into preview folder
        run: |
          git fetch origin receptionist-v07
          mkdir -p v07-test
          git archive origin/receptionist-v07 | tar -x -C v07-test
          rm -rf v07-test/.github
          rm -rf v07-test/v07-test
          touch v07-test/.nojekyll

      - name: Commit preview to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add v07-test

          if ! git diff --cached --quiet; then
            git commit -m "Update V0.7 preview"
            git push origin HEAD:main
          fi
